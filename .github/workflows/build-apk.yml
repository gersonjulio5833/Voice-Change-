name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: |
          unzip -q ./*.zip
          ls NaturalFemaleVoiceAI

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Testes unitários
        working-directory: NaturalFemaleVoiceAI
        run: gradle --no-daemon testDebugUnitTest

      - name: Compilar APK
        working-directory: NaturalFemaleVoiceAI
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NaturalFemaleVoiceAI-debug-apk
          path: NaturalFemaleVoiceAI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NaturalFemaleVoiceAI/app/build/outputs/apk/debug/*.apk
